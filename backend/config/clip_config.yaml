# ============================================================================
# Surveillance AI - Configuration File
# ============================================================================
# This file contains all configuration settings for the backend.
# Organized by functional area for clarity and maintainability.
# ============================================================================

# ----------------------------------------------------------------------------
# Model Configuration
# ----------------------------------------------------------------------------
model:
  name: ViT-B-32
  batch_size: 8
  frame_size: [224, 224]

# ----------------------------------------------------------------------------
# Device Configuration
# ----------------------------------------------------------------------------
device:
  auto_detect: true
  force_cpu: false
  log_device: true

# ----------------------------------------------------------------------------
# Detection Configuration
# ----------------------------------------------------------------------------
detection:
  similarity_threshold: 0.21  # Threshold for CLIP similarity matching
  # Detector-specific settings
  detectors:
    people:
      enabled: true
    color:
      enabled: true
    fire:
      enabled: true
    weapons:
      enabled: false  # Placeholder, not yet implemented
    vehicles:
      enabled: false  # Placeholder, not yet implemented
    unusual_activity:
      enabled: false  # Placeholder, not yet implemented

# ----------------------------------------------------------------------------
# Frame Extraction Configuration
# ----------------------------------------------------------------------------
frame_extraction:
  output_dir: content/frames
  resize: false
  sampling_rate: 5  # Extract every Nth frame

# ----------------------------------------------------------------------------
# Storage Configuration
# ----------------------------------------------------------------------------
storage:
  faiss_index_dir: "data/faiss_index"  # FAISS vector index storage

# ----------------------------------------------------------------------------
# Preview Configuration
# ----------------------------------------------------------------------------
preview:
  # Legacy server-side preview generation (fallback mode)
  generation:
    enabled: false
    keep_micro_previews: false
    path: "results/previews"
  
  # Preview clip settings
  clip:
    length: 3  # seconds
    output_dir: results/previews
  
  # Preview merge settings for continuous per-label clips
  merge:
    enabled: true
    gap_seconds: 3
    pad_pre_seconds: 2
    pad_post_seconds: 2
    min_seconds: 2
    max_seconds: 30
    keep_micro_previews: false

# ----------------------------------------------------------------------------
# Cache & Media Management
# ----------------------------------------------------------------------------
cache:
  max_total_gb: 8

# ----------------------------------------------------------------------------
# YouTube URL Ingestion Settings
# ----------------------------------------------------------------------------
youtube:
  allow: true

url_ingest:
  enabled: true
  provider: "youtube"
  max_duration_minutes: 120
  max_size_mb: 2048
  work_dir: "uploads/url_tmp"
  user_agent: "Mozilla/5.0"
  keep_hours: 24
  preferred_quality: "bestvideo[ext=mp4]+bestaudio[ext=m4a]/mp4"
  preferred_container: "mp4"
  prefer_codecs: ["h264", "avc1", "mp4a"]
  allow_av1_vp9: true

# ----------------------------------------------------------------------------
# Export Settings
# ----------------------------------------------------------------------------
export:
  enabled: true
  watermark: true
  hash_sha256: true
  store: "local"
  public_base_url: "http://127.0.0.1:8000"
  s3_bucket: ""
  signed_url_ttl_seconds: 900

# ----------------------------------------------------------------------------
# Media Serving Settings
# ----------------------------------------------------------------------------
media_serving:
  accept_ranges: true
  cors_allowed: ["http://localhost:8080", "http://127.0.0.1:8080"]

# ----------------------------------------------------------------------------
# Ring Buffer Settings (for future HLS streaming)
# ----------------------------------------------------------------------------
ring_buffer:
  enabled: false
  type: "hls"
  segment_seconds: 4
  minutes_to_keep: 30
  base_dir: "ring"

# ----------------------------------------------------------------------------
# Path Configuration (Colab Compatibility)
# ----------------------------------------------------------------------------
paths:
  # Local environment paths
  base_results_dir: "./results"
  base_uploads_dir: "./content/uploads"
  base_frames_dir: "./content/frames"
  base_models_dir: "./models"
  
  # Colab environment paths (when COLAB_MODE=true)
  colab_results_dir: "/content/results"
  colab_uploads_dir: "/content/uploads"
  colab_frames_dir: "/content/frames"
  colab_models_dir: "/content/models"
  colab_json_dir: "/content/results/json"

# ----------------------------------------------------------------------------
# Error Handling Settings
# ----------------------------------------------------------------------------
error_handling:
  log_stack_traces: true
  return_detailed_errors: true
  max_retries: 3
  timeout_seconds: 600

# ----------------------------------------------------------------------------
# Live Stream Processing Configuration
# ----------------------------------------------------------------------------
live:
  enabled: true  # Set to true to enable live stream processing
  source_type: "file"  # "file" or "rtsp" (future)
  source_path: "data/live_demo.mp4"  # Path to video file or RTSP URL
  sample_fps: 1.0  # Frames per second to analyze
  prompts: ["person", "car", "fire"]  # Detection prompts (optional, can be empty to use all enabled detectors)
  
  # Queue sizes
  max_frame_queue_size: 100  # Maximum frames in frame queue
  max_alert_queue_size: 1000  # Maximum alerts in alert queue
  
  # Buffer settings
  buffer_retention_minutes: 10.0  # How many minutes of alerts to keep in buffer

# ============================================================================
# Legacy/Backward Compatibility Mappings
# ============================================================================
# These mappings ensure backward compatibility with existing code
# that references old config keys. They will be removed in future versions.
# ============================================================================

# Legacy keys (deprecated, use new structure above)
model_name: ViT-B-32  # Use model.name instead
similarity_threshold: 0.21  # Use detection.similarity_threshold instead
batch_size: 8  # Use model.batch_size instead
frame_size: [224, 224]  # Use model.frame_size instead
preview_clip:
  length: 3
  output_dir: results/previews
